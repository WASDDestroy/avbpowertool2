[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avbpowertool"
version = "2.0.0.dev0"
description = "Android Verified Boot Power Tool — configuration-driven avbtool wrapper"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "numpy>=1.20,<3.0",
    "reedsolo>=1.7,<3.0",
    "windows-curses>=2.4; sys_platform == 'win32'",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "pyright[nodejs]"]

[project.scripts]
avbpowertool = "avbpowertool.presentation.cli.parser:main"

[tool.setuptools.packages.find]
include = ["avbpowertool*"]

[tool.setuptools.package-data]
avbpowertool = [
    "resources/*.json",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["avbpowertool"]
exclude = [
    "tests",
    "references",
    "avbpowertool/vendor",
    "avbpowertool/infrastructure/persistence/profile_codec.py",
    "avbpowertool/infrastructure/persistence/v2_to_v3.py",
    "avbpowertool/infrastructure/persistence/archive_repository.py",
    "avbpowertool/infrastructure/persistence/key_repository.py",
    "avbpowertool/infrastructure/persistence/v1_profile_codec.py",
    "avbpowertool/application/services/inspect_images.py",
    "avbpowertool/presentation/tui/views/settings.py",
]
